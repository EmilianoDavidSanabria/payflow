[build]
builder = "DOCKERFILE"

[deploy]
startCommand = "cd payflow && gunicorn payflow.wsgi:application --bind 0.0.0.0:$PORT"
healthcheckPath = "/core/health/"
healthcheckTimeout = 300
preDeployCommand = "cd payflow && python manage.py collectstatic --noinput && python manage.py migrate"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10